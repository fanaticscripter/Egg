  - wasmegg/smart-assistant
  - wasmegg/shell-company


# pnpm does not run dependency build scripts unless they are allowed here.
# These four need theirs: esbuild and unrs-resolver fetch or link a platform
# binary, @parcel/watcher builds a native addon, and protobufjs generates the
# CLI wrappers pbjs/pbts rely on.
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  protobufjs: true
  unrs-resolver: true

# pnpm rejects lockfile entries published within minimumReleaseAge (24h by
# default), which is a supply-chain guard against freshly published packages.
# typescript-eslint was bumped to 8.70.0 on the day it shipped, so its entries
# have to be vouched for explicitly. Once the pinned versions are older than
# the window these lines are inert and can be deleted; pnpm rewrites this list
# when the pin moves.
minimumReleaseAgeExclude:
  - '@typescript-eslint/eslint-plugin@8.70.0'
  - '@typescript-eslint/parser@8.70.0'
  - '@typescript-eslint/project-service@8.70.0'
  - '@typescript-eslint/scope-manager@8.70.0'
  - '@typescript-eslint/tsconfig-utils@8.70.0'
  - '@typescript-eslint/type-utils@8.70.0'
  - '@typescript-eslint/types@8.70.0'
  - '@typescript-eslint/typescript-estree@8.70.0'
  - '@typescript-eslint/utils@8.70.0'
  - '@typescript-eslint/visitor-keys@8.70.0'
  - typescript-eslint@8.70.0
